<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨韵小筑 | 我的中式园林</title>
    <style>
        /* 基础设置：宣纸底色与中文字体 */
        :root {
            --bg-color: #f4f1ea; /* 宣纸黄 */
            --ink-color: #333333; /* 墨黑 */
            --accent-green: #4a5d4e; /* 黛绿 */
            --accent-red: #9e3d3d; /* 朱砂红 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            /* 添加一点纸张纹理感 */
            background-image: 
                radial-gradient(#e5e0d5 1px, transparent 1px),
                radial-gradient(#e5e0d5 1px, transparent 1px);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            color: var(--ink-color);
            font-family: "STKaiti", "KaiTi", "楷体", "Songti SC", serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 顶部标题区 */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 0.2em;
            font-weight: normal;
            position: relative;
            display: inline-block;
        }

        /* 朱砂印章效果 */
        h1::after {
            content: "私印";
            position: absolute;
            bottom: -10px;
            right: -40px;
            font-size: 0.8rem;
            background-color: var(--accent-red);
            color: #fff;
            padding: 4px;
            writing-mode: vertical-rl;
            border-radius: 2px;
            font-weight: bold;
            letter-spacing: 0.2em;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            opacity: 0.8;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--accent-green);
            letter-spacing: 0.3em;
            margin-top: 15px;
            opacity: 0.7;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 模块标题 */
        .section-title {
            font-size: 1.8rem;
            color: var(--accent-green);
            margin: 60px 0 30px;
            padding-left: 20px;
            border-left: 4px solid var(--accent-green);
            display: flex;
            align-items: center;
        }
        
        .section-title::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, var(--accent-green), transparent);
            margin-left: 20px;
            opacity: 0.3;
        }

        /* 照片墙：错落布局 */
        .photo-wall {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .photo-frame {
            background: #fff;
            padding: 12px 12px 40px 12px; /* 底部留白类似画轴 */
            box-shadow: 2px 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e0dcd3;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            position: relative;
        }

        /* 模拟画框内的内衬 */
        .photo-frame::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid rgba(0,0,0,0.05);
            pointer-events: none;
        }

        .photo-frame img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            filter: sepia(0.2) contrast(0.9); /* 给照片加一点古风滤镜 */
            transition: filter 0.4s;
            border: 1px solid #ddd;
        }

        .photo-frame:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 5px 15px 25px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .photo-frame:hover img {
            filter: sepia(0) contrast(1); /* 悬停时恢复色彩 */
        }

        /* 便利贴墙 */
        .note-wall {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            padding: 40px 20px;
        }

        /* 宣纸便签样式 */
        .sticky-note {
            width: 220px;
            min-height: 220px;
            background-color: #fdfaf2;
            padding: 30px 20px;
            box-shadow: 3px 5px 15px rgba(0,0,0,0.1);
            position: relative;
            transition: all 0.3s ease;
            /* 模拟宣纸边缘微卷 */
            border-radius: 2px 2px 10px 2px;
            border: 1px solid #efe6d5;
            font-size: 1.1rem;
            color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* 随机倾斜角度，使用 nth-child */
        .sticky-note:nth-child(1) { transform: rotate(-3deg); }
        .sticky-note:nth-child(2) { transform: rotate(2deg); }
        .sticky-note:nth-child(3) { transform: rotate(-1.5deg); }
        .sticky-note:nth-child(4) { transform: rotate(3deg); }
        .sticky-note:nth-child(5) { transform: rotate(-2deg); }

        .sticky-note:hover {
            transform: rotate(0deg) scale(1.05);
            box-shadow: 5px 10px 25px rgba(0,0,0,0.15);
            z-index: 10;
        }

        /* 图钉效果（红色朱砂点） */
        .sticky-note::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.3), 2px 2px 5px rgba(0,0,0,0.2);
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px;
            margin-top: 60px;
            color: var(--accent-green);
            font-size: 0.9rem;
            opacity: 0.7;
            border-top: 1px dashed rgba(74, 93, 78, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>墨韵小筑</h1>
        <div class="subtitle">曲径通幽处 · 禅房花木深</div>
    </header>

    <div class="container">
        <!-- 照片墙区域 -->
        <h2 class="section-title">「 浮光掠影 · 照片墙 」</h2>
        <div class="photo-wall">
            <!-- 照片 1 -->
            <div class="photo-frame">
                <!-- 替换为你自己的图片链接或本地路径，例如 images/photo1.jpg -->
                <img src="https://images.unsplash.com/photo-1545048702-79362596cdc9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="园林一角">
            </div>
            <!-- 照片 2 -->
            <div class="photo-frame">
                <img src="https://images.unsplash.com/photo-1522383225653-ed111181a951?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="竹影">
            </div>
            <!-- 照片 3 -->
            <div class="photo-frame">
                <img src="https://images.unsplash.com/photo-1505130771639-8613e2058c2c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="远山">
            </div>
        </div>

        <!-- 便利贴区域 -->
        <h2 class="section-title">「 随笔拾遗 · 便利贴墙 」</h2>
        <div class="note-wall">
            <div class="sticky-note">
                今日听雨，读书，吃茶。<br>甚好。
            </div>
            <div class="sticky-note">
                网站终于部署成功啦！<br>Cloudflare 真好用。
            </div>
            <div class="sticky-note">
                逢人不说人间事，<br>便是人间无事人。
            </div>
            <div class="sticky-note">
                别忘记给 NAS 加上<br>Access 保护哦。
            </div>
        </div>
    </div>

    <footer>
        © 2026 我的个人网站 · 基于 Cloudflare 构建
    </footer>

</body>
</html>
